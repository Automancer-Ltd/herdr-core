# Every push to master and every pull request: formatting, the dependency
# policy and clippy for Windows from Linux, then the whole suite on Linux
# (real PTYs, real processes). What is too slow for every pull request — the
# other platforms, clippy for the release target, and the upgrade test against
# the last release — is in extended.yml, run on demand.
#
# Runner choice: the hosted x86_64 Linux jobs take the controller-owned
# CI_RUNNER variable (testing skill, rule 4), never a hard-coded label.
#
# Cache rules: one pinned toolchain so caches survive
# stable bumps; only master pushes save, so PR caches can't evict the ones
# everybody restores; libghostty-vt's Zig build lives in the ghostty-vt
# crate's OUT_DIR, kept with the workspace crates.
name: ci

on:
  push:
    branches: [master]
  # No paths-ignore here: CI is required to merge, so every PR needs it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. On master,
# runs queue instead: a cancelled master run never saves its cache.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0
  # File/line backtraces without full debug info: smaller target, faster cache.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  SAVE_CACHES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  # Each test binary aborts if it runs this long (a hang, not a slow test):
  # 30 s on our machines; GitHub's runners are slower.
  HC_TEST_WATCHDOG_S: "120"
  # A test that checks hc keeps a fixed timing (50 ms to finish a key
  # sequence) skips that check here: a loaded runner can't keep it.
  HC_TEST_SLOW_RUNNER: "1"

jobs:
  # Cheap and on every push: formatting, and clippy for Windows from Linux
  # (zig stubbed: type-checking needs no libghostty-vt), so Windows code is
  # checked even though the Windows tests only run in the extended suite.
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lint
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - run: cargo fmt --all -- --check
      # Advisories (RustSec), licenses, sources: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - run: mkdir -p vendor/ghostty
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
        env:
          ZIG: ${{ github.workspace }}/scripts/zig-stub.sh

  test:
    # Linux tests the static musl build, which is what releases ship. macOS and
    # Windows run on demand in extended.yml: their jobs cost minutes each, and
    # the whole pull-request verdict must fit five.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      # cli_docs runs the built binary's help: generated reference freshness
      # and README/docs command/flag checks, with file:line failures.
      - name: Tests (including human docs)
        shell: bash
        run: cargo test --locked --no-fail-fast --target x86_64-unknown-linux-musl -- --test-threads 2

  # The one check master's ruleset requires. It has no needs-conditional of its
  # own, so it always reports.
  ci-ok:
    needs: [lint, test]
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]'
