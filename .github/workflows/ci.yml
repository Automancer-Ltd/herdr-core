# Every push to master and every pull request: formatting, the dependency
# policy and clippy for Windows from Linux, then the whole suite on Linux
# (real PTYs, real processes). That verdict must fit five minutes.
#
# The extended suite — clippy for the release target, the macOS and Windows
# suites, and the upgrade test against the last release — runs only on
# workflow_dispatch, and every one of its jobs is bounded at ten minutes. It
# lives in this file rather than a workflow of its own because GitHub only
# dispatches a workflow that exists on the repository's default branch, and
# this fork's default branch is upstream's master; a separate extended.yml
# could be committed here and never started.
#
# Runner choice: hosted x86_64 Linux jobs take the controller-owned CI_RUNNER
# variable (testing skill, rule 4), never a hard-coded label; the arm, macOS
# and Windows jobs need a specific host and keep their specialist label.
#
# Cache rules: one pinned toolchain so caches survive stable bumps; only
# master pushes save, so PR caches can't evict the ones everybody restores.
# The keys are the triple-based ones upstream's master workflow saves
# (matrix.target-dev), so a fork run restores those caches instead of building
# from cold; the job id keeps one job's cache apart from another's.
# libghostty-vt's Zig build lives in the ghostty-vt crate's OUT_DIR, kept with
# the workspace crates.
name: ci

on:
  push:
    branches: [master]
  # No paths-ignore here: CI is required to merge, so every PR needs it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. On master,
# runs queue instead: a cancelled master run never saves its cache. A dispatch
# on a branch takes its own group, so it never cancels that branch's PR run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0
  # File/line backtraces without full debug info: smaller target, faster cache.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  SAVE_CACHES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  # Each test binary aborts if it runs this long (a hang, not a slow test):
  # 30 s on our machines; GitHub's runners are slower.
  HC_TEST_WATCHDOG_S: "120"
  # A test that checks hc keeps a fixed timing (50 ms to finish a key
  # sequence) skips that check here: a loaded runner can't keep it.
  HC_TEST_SLOW_RUNNER: "1"

jobs:
  # Cheap and on every push: formatting, and clippy for Windows from Linux
  # (zig stubbed: type-checking needs no libghostty-vt), so Windows code is
  # checked even on changes that never run the Windows tests.
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lint
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - run: cargo fmt --all -- --check
      # Advisories (RustSec), licenses, sources: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - run: mkdir -p vendor/ghostty
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
        env:
          ZIG: ${{ github.workspace }}/scripts/zig-stub.sh

  # Linux tests the static musl build, which is what releases ship. macOS and
  # Windows run in the extended suite below: their jobs cost minutes each, and
  # the whole pull-request verdict must fit five.
  #
  # Two shards by measured need: a cold musl build is one to two minutes and
  # the test binaries another two and a half, so one job sat on the five-minute
  # cap (run 41312003743 was cancelled by it). The split is computed from
  # crates/herdr-core/tests/*.rs, so a new test file always lands in exactly one
  # shard rather than being silently skipped.
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      # cli_docs runs the built binary's help: generated reference freshness
      # and README/docs command/flag checks, with file:line failures.
      - name: Tests (including human docs)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tests=()
          lib=()
          i=0
          for t in crates/herdr-core/tests/*.rs; do
            if [ $((i % 2)) -eq "$SHARD" ]; then tests+=(--test "$(basename "$t" .rs)"); fi
            i=$((i+1))
          done
          if [ "$SHARD" = 0 ]; then lib=(--lib --bins); fi
          cargo test --locked --no-fail-fast --target x86_64-unknown-linux-musl \
            "${lib[@]}" "${tests[@]}" -- --test-threads 2

  # The one check master's ruleset requires.
  ci-ok:
    needs: [lint, test]
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]'

  # ---- the extended suite: workflow_dispatch only --------------------------
  #
  # These jobs are skipped on every pull request, so they cost nothing there.
  # They save their caches on a dispatch: the extended suite is always started
  # on a branch, and a branch's cache is restorable by that branch's next run.

  clippy-linux:
    # clippy for the release target recompiles the workspace, so it is checked
    # on demand rather than on every change.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl-dev # the test job's build
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: cargo clippy --locked --target x86_64-unknown-linux-musl --all-targets -- -D warnings

  test-macos:
    # Two shards for the ten-minute cap: macOS is three cores, and one cold
    # build plus the whole suite ran past nine minutes (run 41312705323).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64-apple-darwin-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      # No clippy here: the same unix code is clippy-checked in clippy-linux
      # and this build compiles every cfg(macos) line, while the macOS clippy
      # pass cost four of the job's ten minutes.
      #
      # Full-screen scrolling tests are disabled on macOS CI because runner
      # timing is unreliable, and the rest are split by test binary.
      - name: Tests (including human docs)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          only=()
          i=0
          for t in crates/herdr-core/tests/*.rs; do
            name=$(basename "$t" .rs)
            if [ "$name" != stitch ] && [ $((i % 2)) -eq "$SHARD" ]; then only+=(--test "$name"); fi
            i=$((i+1))
          done
          if [ "$SHARD" = 0 ]; then only+=(--lib --bins); fi
          cargo test --locked --no-fail-fast --target aarch64-apple-darwin \
            "${only[@]}" -- --test-threads 2

  test-windows:
    # Windows: the Unix tests skip themselves; tests/windows.rs runs instead.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-pc-windows-msvc-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      # Windows' own ConPTY swallows answers to programs: hc ships Microsoft's.
      - shell: pwsh
        run: scripts/fetch-conpty.ps1 -Dest target/x86_64-pc-windows-msvc/debug
      # cli_docs runs the built binary's help: generated reference freshness
      # and README/docs command/flag checks, with file:line failures.
      - name: Tests (including human docs)
        shell: bash
        run: cargo test --locked --no-fail-fast --target x86_64-pc-windows-msvc -- --test-threads 2

  upgrade:
    # Building the last release takes minutes: an update must never break
    # running terminals, but that build does not belong in a pull-request
    # verdict.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0 # the release tags
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl-dev # the test job's build
          cache-workspace-crates: true
          cache-bin: false
          save-if: false
      - name: The last release
        id: last
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] && echo "sha=$(git rev-parse --short "$tag")" >> "$GITHUB_OUTPUT" || true
          # Releases before 0.2 built Ghostty for the building CPU: a copy
          # cached on one runner can crash on another (SIGILL).
          echo "cpu=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # A release's binary never changes: built once, kept by its tag (and CPU).
      - if: steps.last.outputs.tag != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/hc-upgrade/${{ steps.last.outputs.sha }}
          key: upgrade-from-${{ steps.last.outputs.tag }}-${{ steps.last.outputs.sha }}-${{ steps.last.outputs.cpu }}
      - name: Upgrade from the last release
        run: |
          tag=${{ steps.last.outputs.tag }}
          if [ -z "$tag" ]; then echo "no release yet: nothing to upgrade from"; exit 0; fi
          scripts/upgrade-test.sh "$tag"
